# Favourite-maker: rest BIDS on favourites in the final minutes of 15-minute crypto markets.
#
# Why this and not the model: taking a favourite at the ask wins ~84% of the time and still
# loses money, because crossing the spread costs several cents a fill. Kalshi's crypto series
# use `fee_type = quadratic`, which charges TAKERS only — makers pay nothing. So the entire
# return is the spread you avoid paying, collected on outcomes that are already nearly decided.
#
# Independently reported by a live trader (~1,300 fills, real money) and consistent with our
# own tape backtest (t = 2.27). The open question is queue position, which the paper run measures.

series = ["KXBTC15M", "KXETH15M", "KXSOL15M", "KXXRP15M"]

# Quote inside the favourite band only. Below 0.74 the outcome is not decided enough;
# above 0.93 there is not enough spread left to be worth the inventory risk.
min_price = 0.74
max_price = 0.93

# Final minutes only.
max_tau_secs = 300
min_tau_secs = 20

# Buy the favourite, never sell it.
bid_only = true

# One cent inside the mid: we are trying to be the best bid, not to cross.
half_spread = 0.01
skew_per_contract = 0.002

quote_qty = 5.0
max_inventory = 20.0
max_market_spread = 0.06
requote_ms = 1000
max_markets = 40
